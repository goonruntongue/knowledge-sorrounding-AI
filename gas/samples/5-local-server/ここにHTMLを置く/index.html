<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ローカルサーバーが動いています</title>
    <style>
      body { margin: 0; padding: 24px; background: #f4f8f5; color: #1d3328; font-family: sans-serif; line-height: 1.8; }
      main { max-width: 640px; margin: auto; }
      h1 { font-size: 1.4rem; }
      ul { padding: 0; list-style: none; }
      li { margin-bottom: 12px; }
      a { display: block; padding: 14px 16px; border: 1px solid #cfe3d6; border-radius: 12px; background: #fff; color: #1f6f48; font-weight: bold; text-decoration: none; }
      a span { display: block; color: #6a7f73; font-size: .85rem; font-weight: normal; }
      .note { color: #6a7f73; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>ローカルサーバーが動いています</h1>
      <p>このページは「ここにHTMLを置く」フォルダーの index.html です。</p>
      <ul>
        <li><a href="notice.html">作例A：お知らせ一覧<span>notice.html の API_URL に、ウェブアプリの URL を入れてから開きます</span></a></li>
        <li><a href="attendance.html">作例B：出欠フォーム<span>attendance.html の API_URL に、ウェブアプリの URL を入れてから開きます</span></a></li>
      </ul>
      <p class="note">自分で作った HTML も、このフォルダーに置けば http://localhost:8000/ファイル名 で開けます。止めるときは、サーバーの画面を閉じます。</p>
    </main>
  </body>
</html>
