<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a43">
  <title>WEBサイトとは | Knowledge Surrounding AI</title>
  <link rel="icon" href="../pwa-icon-web-knowledge-navy-512.png" type="image/png">
  <link rel="apple-touch-icon" href="../pwa-icon-web-knowledge-navy-192.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../copyright.css">
  <style>
    :root { --navy:#071a43; --ink:#102747; --yellow:#ffd24a; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; color:var(--ink); background:linear-gradient(135deg,#fff8df,#eaf8ff); font-family:"Noto Sans JP",sans-serif; }
    main { width:min(90%,900px); min-height:calc(100vh - 180px); margin:0 auto; padding:clamp(2rem,7vw,4.5rem) 0; }
    .portal-link { display:inline-flex; align-items:center; padding:.66rem 1.15rem; border:3px solid var(--navy); border-radius:999px; color:var(--navy); background:var(--yellow); box-shadow:4px 4px 0 var(--navy); font-weight:800; text-decoration:none; }
    .portal-link:hover { transform:translate(1px,1px); box-shadow:3px 3px 0 var(--navy); }
    .hero { display:grid; justify-items:center; padding:clamp(3rem,10vw,6rem) 1rem; text-align:center; }
    .hero img { width:min(100%,360px); height:auto; margin:0 0 -2rem; object-fit:contain; }
    .eyebrow { margin:0; color:#2f7ed8; font:800 .9rem/1 Poppins,sans-serif; letter-spacing:.12em; }
    h1 { margin:.55rem 0 0; color:var(--navy); font:800 clamp(2.5rem,10vw,5rem)/1.12 Poppins,"Noto Sans JP",sans-serif; }
    .notice { max-width:560px; margin:1.5rem auto 0; padding:1rem 1.3rem; border:3px solid var(--navy); border-radius:18px; color:#fff; background:var(--navy); font-weight:800; }
    footer { width:min(90%,900px); margin:0 auto; padding:1.5rem 0 2.4rem; text-align:center; }
    footer .portal-link { margin-bottom:1.5rem; }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; } }
  </style>
</head>
<body>
  <main>
    <a class="portal-link" href="../index.html">ポータルへ戻る</a>
    <section class="hero" aria-labelledby="page-title">
      <img src="../portal-website-card.png" width="1536" height="1024" alt="ブラウザ画面とカーソルのイラスト">
      <p class="eyebrow">WEB SITE BASICS</p>
      <h1 id="page-title">WEBサイトとは</h1>
      <p class="notice">このガイドは準備中です。</p>
    </section>
  </main>
  <footer>
    <a class="portal-link" href="../index.html">ポータルへ戻る</a>
    <div class="site-copyright"><span>Copyright &copy; 2026 Flashmelody Katsuyori M</span><img class="site-copyright__logo" src="../assets/maishilogo_white_outlined.svg" alt="FlashMelody"></div>
  </footer>
</body>
</html>
