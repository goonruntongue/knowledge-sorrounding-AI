<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Surrounding AI</title>
  <meta name="theme-color" content="#237a57">
  <link rel="icon" href="globe-pwa.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="pwa-icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#18332a; --green:#237a57; --blue:#2c5f7d; --navy:#163d58; --mint:#e6f4ec; --line:#cfe1d7; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; color:var(--ink); background:radial-gradient(circle at 90% 5%,#c9e9d9 0 180px,transparent 181px),#f4f7f5; font-family:"Noto Sans JP",sans-serif; }
    main { position:relative; isolation:isolate; width:min(90%,960px); margin:0 auto; padding:clamp(4rem,12vw,8rem) 0 4rem; }
    .hero-orb { position:absolute; top:-1.5rem; right:-9rem; width:min(54vw,510px); /* aspect-ratio:1; */ pointer-events:none; }
    .hero-orb--aura { --orb-opacity:.06; z-index:-3; filter:blur(11px) saturate(1.2); opacity:var(--orb-opacity); transform:scale(1.075); }
    .hero-orb--glow { --orb-opacity:.18; z-index:-2; filter:blur(3px); opacity:var(--orb-opacity); transform:scale(1.03); }
    .hero-orb--image { --orb-opacity:.69; z-index:-1; opacity:var(--orb-opacity); }
    main { animation:page-enter .46s cubic-bezier(.22,.75,.3,1) both; }
    footer { animation:page-enter .46s .08s cubic-bezier(.22,.75,.3,1) both; }
    .hero-orb--aura { animation:orb-aura-enter .7s .08s ease-out both; }
    .hero-orb--glow { animation:orb-glow-enter .62s .08s ease-out both; }
    .hero-orb--image { animation:orb-image-enter .54s .08s ease-out both; }
    @keyframes page-enter { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    @keyframes orb-aura-enter { from { opacity:0; transform:scale(.98); } to { opacity:var(--orb-opacity); transform:scale(1.075); } }
    @keyframes orb-glow-enter { from { opacity:0; transform:scale(.98); } to { opacity:var(--orb-opacity); transform:scale(1.03); } }
    @keyframes orb-image-enter { from { opacity:0; transform:scale(.98); } to { opacity:var(--orb-opacity); transform:scale(1); } }
    .eyebrow { margin:0 0 .6rem; color:var(--blue); font:800 .85rem/1 Poppins,sans-serif; letter-spacing:.14em; }
    h1 { margin:0; color:var(--navy); font:800 clamp(2.3rem,7vw,4.8rem)/1.15 Poppins,"Noto Sans JP",sans-serif; letter-spacing:-.045em; }
    .heading-accent { color:var(--blue); }
    .lead { max-width:620px; margin:1.35rem 0 3rem; font-size:1.05rem; line-height:1.9; }
    h2 { margin:0 0 1rem; font-size:1.2rem; }
    .menu { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1rem; }
    .menu a { display:block; min-height:180px; padding:1.5rem; border:1px solid var(--line); border-radius:16px; color:var(--ink); background:#fff; box-shadow:0 6px 24px #23482a0b; text-decoration:none; transition:transform .18s,box-shadow .18s; }
    .menu a:hover { transform:translateY(-4px); box-shadow:0 12px 28px #23482a18; }
    .number { display:block; margin-bottom:1.1rem; color:var(--green); font:800 .8rem Poppins,sans-serif; letter-spacing:.12em; }
    .title { display:block; font-size:1.35rem; font-weight:800; }
    .description { display:block; margin-top:.5rem; font-size:.92rem; line-height:1.7; }
    .arrow { display:block; margin-top:1.2rem; color:var(--green); font-weight:800; }
    footer { width:min(90%,960px); margin:0 auto; padding:2rem 0; color:#5a7166; font-size:.82rem; }
    @media (max-width:640px) {
      .hero-orb { top:-2.5rem; right:-5.5rem; width:340px; }
      .hero-orb--aura { --orb-opacity:.04; }
      .hero-orb--glow { --orb-opacity:.12; }
      .hero-orb--image { --orb-opacity:.408; }
    }
    @media (prefers-reduced-motion:reduce) {
      main, footer, .hero-orb--aura, .hero-orb--glow, .hero-orb--image { animation:none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="hero-orb hero-orb--aura" src="Sphere_rotating.gif" alt="" aria-hidden="true">
    <img class="hero-orb hero-orb--glow" src="Sphere_rotating.gif" alt="" aria-hidden="true">
    <img class="hero-orb hero-orb--image" src="Sphere_rotating.gif" alt="" aria-hidden="true">
    <p class="eyebrow">KNOWLEDGE SURROUNDING AI</p>
    <h1>Web技術の<span class="heading-accent">周辺知識</span></h1>
    <p class="lead">AIを活用してつくる・学ぶための、実践的なガイドをまとめていく入口です。</p>
    <section aria-labelledby="menu-title">
      <h2 id="menu-title">ガイド一覧</h2>
      <nav class="menu">
        <a href="git-github/">
          <span class="number">01 / GIT &amp; GITHUB</span>
          <span class="title">Git と GitHub</span>
          <span class="description">インストール、アカウント登録、基本的な使い方を初学者向けに解説します。</span>
          <span class="arrow">ガイドを開く →</span>
        </a>
      </nav>
    </section>
  </main>
  <footer>Knowledge Surrounding AI</footer>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
    }
  </script>
</body>
</html>
