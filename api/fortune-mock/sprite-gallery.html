<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おたよりスプライト一覧</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a href="index.html">← モックへ戻る</a><span>60 SPRITES</span></header><main class="wrap gallery-page"><h1>おたよりの画像一覧</h1><p id="gallery-status" role="status">読み込み中…</p><div id="gallery" class="gallery"></div></main><script>fetch('fortune.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{const gallery=document.getElementById('gallery');for(let month=1;month<=12;month++){const heading=document.createElement('h2');heading.textContent=`${month}月`;gallery.append(heading);data[month].forEach(item=>{const figure=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption');img.src=item.image;img.alt=item.alt;img.width=512;img.height=512;img.loading='lazy';caption.textContent=`${item.id}：${item.message}`;figure.append(img,caption);gallery.append(figure)})}document.getElementById('gallery-status').textContent='12か月×5枚。背景透過のPNGを個別に表示しています。'}).catch(()=>document.getElementById('gallery-status').textContent='付属サーバーから開いてください。');</script></body></html>
